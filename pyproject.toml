[project]
name = "landa-ai-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PL"]
ignore = [
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004"]
# Repository functions take their statement's $n parameters positionally, in placeholder order.
"app/repositories/*.py" = ["PLR0917"]
# Heuristic and schema code moved verbatim out of the legacy modules (refactor wave 2, step 2.1) keeps its
# thresholds inline; naming them is a follow-up. Every other rule applies.
"app/content/*.py" = ["PLR2004"]
"app/services/staged_unit/*.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

# The legacy modules (the V5 lesson-author pipeline: app/services/lesson_author, app/workflows and the legacy modules
# of app/, deleted in PRD-3) are checked as strictly as the rest. Their known errors are counted per file in
# scripts/mypy_baseline.json, a record that only shrinks (scripts/mypy_baseline.py, the gate's mypy step); it replaced
# ``ignore_errors = true`` for those modules in refactor wave 3b.

# Third-party packages that ship no type information.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "openpyxl", "openpyxl.*", "xlrd"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
timeout = 120

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
