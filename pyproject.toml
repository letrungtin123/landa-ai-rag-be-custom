[project]
name = "landa-ai-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PL"]
ignore = [
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

# Legacy modules imported by strict code (app/idm). They keep the "no new errors"
# baseline (STD-2) until PRD-2 moves and types them; strict modules still see
# their signatures.
[[tool.mypy.overrides]]
module = [
  "app.instructional_density",
  "app.instructional_quality",
  "app.learner_content_purity",
  "app.lesson_author_orchestration_v2",
  "app.lesson_author_orchestration_v2_provider",
  "app.ordered_learning_content",
  "app.source_evidence_bundle",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
timeout = 120

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
