# Server B (AI) runtime: landa-ai-rag behind nginx TLS on 8443. One instance.
#
# Interpolation variables come from /etc/landa-ai/release.env (see release.env.example), always via
#   docker compose --project-directory /opt/landa-ai/deploy/server-b --env-file /etc/landa-ai/release.env ...
# Do not export these variables in the shell: shell values override --env-file.
# Container secrets come from ${AI_RAG_ENV_FILE}, rendered by fetch-secrets.sh (0600, root).
#
# Fixed addressing: nginx is the only trusted proxy (AI_RAG_FORWARDED_ALLOW_IPS) and the upstream in
# nginx/ai-rag.conf is a static IP. If 172.30.10.0/24 overlaps the VPC or a peered network, change the
# subnet, both ipv4_address values, AI_RAG_FORWARDED_ALLOW_IPS and the nginx upstream together.

name: landa-ai

x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  ai-rag:
    <<: *hardening
    image: ${AI_RAG_IMAGE:?set AI_RAG_IMAGE in release.env (ECR image by sha tag or digest)}
    init: true                  # reaps LibreOffice children; forwards SIGTERM to uvicorn
    user: "10001:10001"
    env_file:
      - ${AI_RAG_ENV_FILE:-/etc/landa-ai/ai-rag.env}
    environment:
      # Pinned here because they are coupled to this compose file and nginx/ai-rag.conf; they
      # override anything in the env file.
      AI_RAG_ENV: production
      AI_RAG_HOST: 0.0.0.0
      AI_RAG_PORT: "8010"
      AI_RAG_WORKERS: "1"                       # HMAC replay cache is per process: keep 1
      AI_RAG_PROXY_HEADERS: "true"
      AI_RAG_FORWARDED_ALLOW_IPS: 172.30.10.2   # nginx container only
      AI_RAG_KEEP_ALIVE_TIMEOUT_SECONDS: "75"   # > nginx upstream keepalive_timeout (60 s)
      TMPDIR: /tmp
    tmpfs:
      # Uploaded documents (<= AI_RAG_MAX_DOCUMENT_BYTES) and LibreOffice profiles live here.
      # tmpfs pages count against mem_limit.
      - /tmp:rw,noexec,nosuid,nodev,size=${AI_RAG_TMPFS_SIZE:-512m},mode=1777
    volumes:
      # CA that signed server A's Postgres certificate (DATABASE_URL sslrootcert=...).
      - ${AI_RAG_PG_CA_FILE:-/etc/landa-ai/tls/pg-ca.pem}:/etc/landa-ai/tls/pg-ca.pem:ro
      # Internal CA of nginx's certificate; used only by smoke.py through nginx.
      - ${AI_RAG_INTERNAL_CA_FILE:-/etc/landa-ai/tls/internal-ca.pem}:/etc/landa-ai/tls/internal-ca.pem:ro
    extra_hosts:
      # Lets smoke.py call nginx by the certificate name from inside this container.
      - "${AI_RAG_TLS_SERVER_NAME:?set AI_RAG_TLS_SERVER_NAME in release.env}:172.30.10.2"
    ports:
      - "127.0.0.1:8010:8010"   # host-local health/debug only; callers go through nginx :8443
    networks:
      ai-rag-net:
        ipv4_address: 172.30.10.10
    mem_limit: ${AI_RAG_MEM_LIMIT:-3g}
    memswap_limit: ${AI_RAG_MEM_LIMIT:-3g}
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_signal: SIGTERM
    # > AI_RAG_SHUTDOWN_GRACE_SECONDS (default 60) so uvicorn can drain before SIGKILL.
    stop_grace_period: ${AI_RAG_STOP_GRACE_PERIOD:-75s}
    # The image HEALTHCHECK (/healthz via python) applies.
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION in release.env}
        awslogs-group: ${AI_RAG_LOG_GROUP:-/landa/ai-rag/prod/app}
        awslogs-stream: ${AI_RAG_LOG_STREAM_PREFIX:-server-b}-ai-rag
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 8m

  nginx:
    <<: *hardening
    image: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.28-alpine}   # pin @sha256 in release.env
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    tmpfs:
      # pid file, client body and proxy temp files (bodies up to 25 MiB).
      - /tmp:rw,noexec,nosuid,nodev,size=${NGINX_TMPFS_SIZE:-256m},mode=1777
    volumes:
      - ./nginx/ai-rag.conf:/etc/nginx/conf.d/default.conf:ro
      - ${AI_RAG_TLS_CERT_FILE:-/etc/landa-ai/tls/server.crt}:/etc/nginx/tls/server.crt:ro
      - ${AI_RAG_TLS_KEY_FILE:-/etc/landa-ai/tls/server.key}:/etc/nginx/tls/server.key:ro
    ports:
      - "${AI_RAG_TLS_BIND_ADDRESS:-0.0.0.0}:8443:8443"   # security group: only server A's SG
    networks:
      ai-rag-net:
        ipv4_address: 172.30.10.2
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION in release.env}
        awslogs-group: ${NGINX_LOG_GROUP:-/landa/ai-rag/prod/nginx}
        awslogs-stream: ${AI_RAG_LOG_STREAM_PREFIX:-server-b}-nginx
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 4m

networks:
  ai-rag-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
