# nginx in front of landa-ai-rag on server B (SEP-3 / INF-1).
# Mounted as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged (runs as uid 101; its
# nginx.conf includes this file inside http{} and keeps pid/temp paths under /tmp, a tmpfs here).
#
# Invariants (do not change without reading deploy/server-b/RUNBOOK.md):
#   * No path rewrite: the backend HMAC-signs "ts\nMETHOD\npath\nsha256(body)". `proxy_pass` has no
#     URI part, so the request URI reaches uvicorn exactly as the backend sent it. No location
#     prefixes, no rewrite/return on API paths, AI_RAG_SERVICE_URL on server A is origin-only.
#   * Long requests: up to 585 s of server work; the backend waits up to 900 s for indexing without
#     any bytes flowing -> read/send timeouts 960 s.
#   * Upstream keep-alive must close BEFORE uvicorn's (AI_RAG_KEEP_ALIVE_TIMEOUT_SECONDS=75, pinned in
#     docker-compose.yml): 60 s < 75 s, otherwise nginx can reuse a socket uvicorn is closing (ECONNRESET).
#   * Bodies: course-skeleton requests are up to 24 MiB (AI_RAG_IDM_MAX_REQUEST_BYTES) -> 25m.

# Access log: JSON, path only ($uri has no query string), never bodies or X-Landa-* auth headers.
log_format ai_rag_json escape=json
    '{"ts":"$time_iso8601","source":"nginx","remote_addr":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"request_length":$request_length,"bytes_sent":$bytes_sent,"request_time":$request_time,'
    '"upstream_status":"$upstream_status","upstream_connect_time":"$upstream_connect_time",'
    '"upstream_response_time":"$upstream_response_time","request_id":"$upstream_http_x_request_id",'
    '"correlation_id":"$http_x_correlation_id","nginx_request_id":"$request_id",'
    '"tls_protocol":"$ssl_protocol"}';

upstream ai_rag {
    # Static address of the ai-rag container on the compose network (docker-compose.yml). An IP,
    # not the service name: nginx resolves names once at start and must not depend on ai-rag
    # being up. One instance: nginx never marks a single server as unavailable.
    server 172.30.10.10:8010;

    keepalive 16;
    keepalive_timeout 60s;     # < uvicorn keep-alive (75 s)
    keepalive_requests 1000;
}

server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    # Internal certificate: SAN must contain the name used in the backend's AI_RAG_SERVICE_URL.
    # server.key must be readable by uid 101 (see RUNBOOK "Internal TLS").
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ai_rag_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Optional hardening (mTLS from server A only); enable together with a client cert on the backend.
    # ssl_client_certificate /etc/nginx/tls/client-ca.crt;
    # ssl_verify_client on;

    access_log /dev/stdout ai_rag_json;
    error_log  /dev/stderr warn;

    client_max_body_size    25m;
    client_body_buffer_size 1m;      # larger bodies spill to /tmp (tmpfs)
    client_header_timeout   30s;
    client_body_timeout     60s;

    # Downstream keep-alive (Node -> nginx). The second value sends "Keep-Alive: timeout=75" so the
    # Node agent retires idle sockets before nginx closes them.
    keepalive_timeout  75s 75s;
    keepalive_requests 1000;
    send_timeout       960s;

    location / {
        proxy_pass http://ai_rag;    # no URI part: path forwarded byte-for-byte

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # This nginx is the first hop: overwrite (never append) client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    960s;
        proxy_read_timeout    960s;

        proxy_request_buffering on;   # whole body before upstream; HMAC needs the exact bytes anyway
        proxy_buffering         on;
        proxy_redirect          off;
        # Never replay a request on another attempt (POSTs are not idempotent; the HMAC replay
        # cache would reject the replay anyway). Client aborts propagate upstream (default), which
        # lets the app cancel provider work for a caller that has gone away.
        proxy_next_upstream off;
    }
}

# Container health endpoint for the compose healthcheck (loopback inside the nginx container only).
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /nginx-health {
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}
